name: Update Dependency Graph for sbt
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v.7.0.1
      - name: Install sbt
        uses: guardian/setup-scala@56ec952f11409b28f4f7ae8d442e4d6deb87fc68 # v2.0.1
      - name: Submit dependencies
        id: submit
        uses: scalacenter/sbt-dependency-submission@3785f1a3a33d00e44076e26804e79f2b98888ed1 # v3.2.1
      - name: Log snapshot for user validation
        id: validate
        run: cat ${{ steps.submit.outputs.snapshot-json-path }} | jq
    permissions:
      contents: write
